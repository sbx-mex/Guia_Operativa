name: Materializar Guia Operativa CORE

on:
  push:
    branches: [feat/remaster-guia-core]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ hashFiles('.bootstrap/part-*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar arbol validado
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/guia-core.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          tar -xzf /tmp/guia-core.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materializar guia operativa core"
          git push origin HEAD:feat/remaster-guia-core
