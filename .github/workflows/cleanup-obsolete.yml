name: Limpiar archivos obsoletos

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: "Escribe ELIMINAR para aplicar la lista cerrada"
        required: true
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmacion == 'ELIMINAR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: limpieza-obsoletos-main
      cancel-in-progress: false
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Vista previa
        run: python scripts/cleanup_obsolete.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Eliminar sólo rutas autorizadas
        run: |
          python scripts/cleanup_obsolete.py --apply
          python scripts/cleanup_obsolete.py --verify-diff

      - name: Registrar limpieza
        run: |
          if git diff --quiet; then
            echo "No hay archivos obsoletos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          python scripts/cleanup_obsolete.py --verify-diff
          git commit -m "chore: eliminar archivos obsoletos autorizados"
          git push
