name: Ordenar raíz y borrar rutas anteriores

on:
  push:
    branches: [main]
    paths:
      - "*"
      - "scripts/cleanup_obsolete.py"
      - "scripts/audit_repository_layout.py"
      - ".github/workflows/cleanup-obsolete.yml"
  workflow_dispatch:
    inputs:
      confirmacion:
        description: "Escribe LIMPIAR_RAIZ para ejecutarlo manualmente"
        required: true
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmacion == 'LIMPIAR_RAIZ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: limpieza-obsoletos-main
      cancel-in-progress: false
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Verificar contexto seguro
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test -z "$(git status --porcelain)"

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar validadores
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Vista previa
        run: python scripts/cleanup_obsolete.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Eliminar sólo rutas autorizadas
        run: |
          python scripts/cleanup_obsolete.py --apply
          python scripts/cleanup_obsolete.py --verify-diff
          python scripts/build_content.py --check
          python scripts/crop_product_images.py --report /tmp/product-image-audit.json
          python scripts/audit_project.py
          python scripts/audit_repository_layout.py
          python -m pytest -q

      - name: Registrar limpieza
        run: |
          if git diff --quiet; then
            echo "No hay archivos obsoletos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          python scripts/cleanup_obsolete.py --verify-diff
          git commit -m "chore: eliminar archivos obsoletos autorizados"
          git push origin HEAD:main
          echo "Raíz ordenada y validada en main." >> "$GITHUB_STEP_SUMMARY"
