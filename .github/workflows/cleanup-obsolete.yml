name: Bloquear contenido obsoleto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar validadores
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validar limpieza y estructura CORE
        run: |
          python scripts/cleanup_obsolete.py
          python scripts/audit_repository_layout.py
          python scripts/build_content.py --check
          python scripts/audit_project.py
