name: Validar y publicar Guía Operativa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar validadores
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Regenerar motor y auditar
        run: |
          python scripts/build_content.py
          python scripts/build_content.py --check
          python scripts/cleanup_obsolete.py --apply
          python scripts/audit_project.py
          python scripts/export_objectives.py data/objectives.json /tmp/objetivos-auditoria.pdf
          test -s /tmp/objetivos-auditoria.pdf
          python -m pytest -q

      - name: Preparar sitio limpio
        run: python scripts/prepare_site.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
