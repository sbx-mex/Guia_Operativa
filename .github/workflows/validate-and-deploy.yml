name: Validar y publicar Guía Operativa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar validadores
        run: python -m pip install --disable-pip-version-check pillow pytest

      - name: Regenerar motor y auditar
        run: |
          python scripts/catalog_import.py
          python scripts/build_content.py
          python -m pytest -q

      - name: Preparar sitio limpio
        run: |
          mkdir -p _site
          cp index.html app.js styles.css manifest.webmanifest sw.js .nojekyll _site/
          cp -R assets data _site/
          test ! -d _site/source
          test ! -d _site/outputs

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
